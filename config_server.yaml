# Server Configuration for Docker Deployment
ingestion:
  chunk_size: 1024
  chunk_overlap: 120
  pdf_min_chunk_tokens: 256
  pdf_max_chunk_tokens: 1024
  pdf_split_overlap_tokens: 120
  pdf_parser: "docling"
  pdf_chunking_strategy: "hierarchical"
  html_parser: "trafilatura"
  html_chunking_strategy: "standard"
  save_snapshots: true
  incremental: true
  state_path: "storage/rebuilds/20260508_065352/ingestion_state.json"

embedding:
  dense_model: "microsoft/harrier-oss-v1-0.6b"
  sparse_model: "opensearch-project/opensearch-neural-sparse-encoding-doc-v3-gte"
  device: "cuda"
  dense_device: "cuda:0"
  sparse_device: "cuda:0"
  batch_size: 1
  quantize_8bit: true

storage:
  milvus_uri: "http://127.0.0.1:19530"
  collection_base_name: "documents"
  collection_name: "documents_rebuild_20260508_080948"
  db_name: "default"

retrieval:
  k: 15                         # Candidate pool fetched from Milvus before reranking
  rerank_top_k: 5               # Docs passed to the LLM after reranking
  reranker_model: null
  reranker_endpoint: "http://127.0.0.1:8012/v1/rerank"

generation:
  llm_endpoint: "${OLLAMA_LLM_ENDPOINT}"
  model_name: "qwen3.5:9b" # Primary local candidate; compare against qwen3.5:4b and qwen3.5:2b in separate runs
  max_tokens: 1200
  temperature: 0.2
  reasoning_effort: none # Set to high/medium/low/none depending on the backend you are testing.

evaluation:
  metrics: ["faithfulness", "answer_relevancy", "context_precision", "context_recall"]
  dataset_path: "storage/eval_datasets/main/ui_main_v2.json"
  run_dir: "storage/eval_runs"
  report_dir: "storage/eval_results"
  prediction_dir: "storage/eval_predictions"
  answer_relevancy_strictness: 1  # Passed to RAGAS ResponseRelevancy(strictness=...); higher is stricter.
