# MyRAG Configuration

# Ingestion settings
ingestion:
  chunk_size: 1000
  chunk_overlap: 120
  pdf_min_chunk_tokens: 300
  pdf_max_chunk_tokens: 1000
  pdf_split_overlap_tokens: 120
  pdf_parser: "docling"
  pdf_chunking_strategy: "hierarchical"
  html_parser: "trafilatura"
  html_chunking_strategy: "standard"
  save_snapshots: true  # Automatically save chunks to storage/snapshots before embedding
  incremental: true

# Embedding models
embedding:
  dense_model: "microsoft/harrier-oss-v1-0.6b"
  sparse_model: "opensearch-project/opensearch-neural-sparse-encoding-doc-v3-gte"
  device: "cuda"
  quantize_8bit: false
  batch_size: 32

# Vector storage
storage:
  milvus_uri: "./milvus.db"
  collection_base_name: "documents"
  collection_name: "documents"
  db_name: "default"

# Retrieval settings
retrieval:
  k: 8                         # Candidate pool fetched from Milvus before reranking
  rerank_top_k: 5               # Docs passed to the LLM after reranking (prevents token overflow)
  reranker_model: null  # Set to null to disable
  reranker_endpoint: null

# LLM generation
generation:
  llm_endpoint: "http://localhost:8000/v1"
  model_name: "llama-3-8b"
  max_tokens: 512
  temperature: 0.0


# Evaluation settings
evaluation:
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall
  judge_mode: "local"
  eval_llm: "llama-3-8b"
  eval_llm_endpoint: "http://localhost:8000/v1"
  eval_llm_api_key_env: "OPENAI_API_KEY"
  eval_embeddings: "microsoft/harrier-oss-v1-0.6b"
  eval_embeddings_endpoint: null
  dataset_path: "storage/eval_datasets/main/ui_main_v2.json"
  run_dir: "storage/eval_runs"
  report_dir: "storage/eval_results"
  prediction_dir: "storage/eval_predictions"
  answer_relevancy_strictness: 1  # Passed to RAGAS ResponseRelevancy(strictness=...); higher is stricter.
